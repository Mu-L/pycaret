name: pycaret (master, dormant)

# PyCaret 3.x (master) is in maintenance-only mode while 4.0 is being
# built on the `v4` branch. The 3.x CI was failing daily against modern
# Python / scikit-learn / NumPy because the codebase predates those
# releases — that's one of the problems 4.0 is here to solve.
#
# This workflow is intentionally set to `workflow_dispatch` only so it
# stops spamming the Actions tab with red runs. The maintainer can
# still trigger it by hand if they want to revisit a 3.x regression.
#
# For the active v4 CI, see: https://github.com/pycaret/pycaret/actions/workflows/test.yml?query=branch%3Av4

on:
  workflow_dispatch:

jobs:
  noop:
    runs-on: ubuntu-latest
    name: 3.x CI disabled (see v4 branch)
    steps:
      - name: Remind where CI has moved
        run: |
          echo "PyCaret 3.x CI is dormant. Active CI runs on the v4 branch."
          echo "  - v4 branch:  https://github.com/pycaret/pycaret/tree/v4"
          echo "  - v4 actions: https://github.com/pycaret/pycaret/actions?query=branch%3Av4"
